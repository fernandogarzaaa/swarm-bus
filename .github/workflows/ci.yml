name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: ruff / mypy / pytest
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.9.x"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Mypy (strict)
        run: uv run mypy app tests

      - name: Pytest
        run: uv run pytest -q
